name: build
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: |
          mkdir -p dist
          npx esbuild main.js --bundle --format=esm --platform=browser --target=es2020 --minify --outfile=dist/app.js --define:global=globalThis --alias:net=./shim.js --alias:tls=./shim.js --alias:fs=./shim.js --alias:os=./shim.js --alias:path=./shim.js --alias:http=./shim.js --alias:https=./shim.js --alias:zlib=./shim.js --alias:dns=./shim.js --alias:child_process=./shim.js --alias:socks=./shim.js --alias:node-localstorage=./shim.js --alias:crypto=./shim.js --alias:util=./shim.js
          cp index.html dist/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.d.outputs.page_url }}
    steps:
      - id: d
        uses: actions/deploy-pages@v4
