<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="TG">
<meta name="theme-color" content="#14181f">
<title>TG</title>
<style>
:root{
  --bg:#14181f; --panel:#1b212b; --line:#2a3240; --text:#e8ecf2; --dim:#8a96a8;
  --me:#2b5278; --them:#222a36; --acc:#4fa3e0; --del:#e0605a; --ghost:#9b8cff;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);
  font:16px/1.4 -apple-system,system-ui,"Segoe UI",Roboto,sans-serif}
#app{height:100%;display:flex;flex-direction:column;
  padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}
header{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--panel);
  border-bottom:1px solid var(--line);min-height:52px}
header h1{font-size:17px;margin:0;flex:1;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
button{font:inherit;color:var(--text);background:var(--line);border:0;border-radius:10px;padding:8px 12px;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
button.primary{background:var(--acc);color:#06121d;font-weight:600}
button.icon{padding:6px 10px}
.ghost-on{background:var(--ghost);color:#120d33;font-weight:600}
input[type=text],input[type=password],input[type=tel],input[type=number]{
  width:100%;font:inherit;color:var(--text);background:var(--panel);border:1px solid var(--line);
  border-radius:10px;padding:12px;margin:6px 0}
.hidden{display:none!important}
#login{padding:24px;max-width:420px;margin:0 auto;width:100%;overflow:auto}
#login h2{margin:8px 0 4px}
#login p{color:var(--dim);margin:4px 0 14px;font-size:14px}
#list,#msgs{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
.dlg{display:flex;gap:12px;padding:12px 14px;border-bottom:1px solid var(--line);cursor:pointer}
.dlg:active{background:var(--panel)}
.ava{width:44px;height:44px;border-radius:50%;background:var(--line);display:flex;align-items:center;
  justify-content:center;font-weight:600;flex:none}
.dlg .t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dlg .s{color:var(--dim);font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dlg .b{min-width:0;flex:1}
.unread{background:var(--acc);color:#06121d;border-radius:12px;padding:0 7px;font-size:13px;font-weight:600;align-self:center}
#msgs{padding:10px 10px 4px;display:flex;flex-direction:column;gap:6px}
.m{max-width:82%;padding:8px 11px;border-radius:14px;background:var(--them);word-wrap:break-word;overflow-wrap:anywhere;white-space:pre-wrap}
.m.out{align-self:flex-end;background:var(--me)}
.m.deleted{border:1px dashed var(--del)}
.tag{display:block;font-size:12px;color:var(--del);margin-bottom:2px;white-space:normal}
.tag.edit{color:var(--acc);cursor:pointer}
.tag.ttl{color:var(--ghost)}
.old{font-size:13px;color:var(--dim);border-left:2px solid var(--line);padding-left:8px;margin:4px 0;white-space:pre-wrap}
.meta{font-size:11px;color:var(--dim);text-align:right;margin-top:2px}
.m img,.m video{max-width:100%;border-radius:10px;display:block;margin:4px 0}
.mbtn{margin:4px 6px 4px 0;padding:6px 10px;font-size:14px}
form#send{display:flex;gap:8px;padding:8px 10px;background:var(--panel);border-top:1px solid var(--line)}
form#send input{margin:0}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--panel);
  border:1px solid var(--line);padding:10px 14px;border-radius:12px;max-width:90%;font-size:14px}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;padding:20px;z-index:5}
#modal div{background:var(--panel);padding:18px;border-radius:14px;width:100%;max-width:380px}
.row{display:flex;gap:8px;margin-top:8px}
.empty{color:var(--dim);text-align:center;padding:40px 20px}
</style>
</head>
<body>
<div id="app">
  <section id="login" class="hidden">
    <h2>Вход</h2>
    <p>Ключи с my.telegram.org. Они сохраняются только в этом браузере на вашем телефоне.</p>
    <input id="apiId" type="number" inputmode="numeric" placeholder="api_id" autocomplete="off">
    <input id="apiHash" type="password" placeholder="api_hash" autocomplete="off">
    <button id="loginBtn" class="primary" style="width:100%;margin-top:10px">Войти</button>
    <pre id="err" style="white-space:pre-wrap;word-break:break-word;font-size:12px;color:#e0605a;user-select:text"></pre>
    <p style="text-align:center;font-size:12px">v4</p>
  </section>

  <section id="main" class="hidden" style="display:flex;flex-direction:column;flex:1;min-height:0">
    <header>
      <button id="back" class="icon hidden" aria-label="Назад">←</button>
      <h1 id="title">Чаты</h1>
      <button id="ghostBtn" class="icon">Призрак</button>
      <button id="menuBtn" class="icon" aria-label="Меню">⋯</button>
    </header>
    <div id="list"></div>
    <div id="msgs" class="hidden"></div>
    <form id="send" class="hidden">
      <input id="text" type="text" placeholder="Сообщение" autocomplete="off">
      <button class="primary">→</button>
    </form>
  </section>
</div>
<div id="toast" class="hidden"></div>
<div id="modal" class="hidden"><div>
  <label id="mLabel"></label>
  <input id="mInput" type="text" autocomplete="off">
  <div class="row"><button id="mOk" class="primary" style="flex:1">ОК</button></div>
</div></div>

<script type="module" src="./app.js?v=4"></script>
</body>
</html>
